<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#2a2a4e"/>
    </linearGradient>
    <linearGradient id="car" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c9a84c"/>
      <stop offset="100%" style="stop-color:#b8953a"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- Road -->
  <rect x="0" y="650" width="1600" height="250" fill="#0d0d14"/>
  <line x1="0" y1="725" x2="1600" y2="725" stroke="#333" stroke-width="2" stroke-dasharray="40 20"/>
  <!-- Car body - 2023 911 GT3 RS -->
  <g transform="translate(280, 190) scale(1.7)">
    <!-- Shadow -->
    <ellipse cx="312" cy="430" rx="290" ry="20" fill="rgba(0,0,0,0.4)"/>
    <!-- Body -->
    <path d="M120,160 Q130,120 170,105 L220,95 Q260,88 300,85 Q340,88 380,95 L430,105 Q470,120 490,160 Q500,180 505,220 L510,270 Q510,290 500,300 L120,300 Q110,290 110,270 Z" fill="url(#car)" stroke="#a8852a" stroke-width="1.5"/>
    <!-- GT3 RS wide rear arch -->
    <path d="M480,300 Q500,290 505,270 Q510,290 500,300 Z" fill="#a8852a"/>
    <!-- Rear wing -->
    <path d="M370,80 L440,85 L450,70 L380,65 Z" fill="#111" stroke="#444" stroke-width="1"/>
    <!-- Side intake -->
    <path d="M330,180 Q340,170 360,175 Q370,185 365,200 Q350,210 335,200 Z" fill="#2a2a2a" stroke="#666" stroke-width="1"/>
    <!-- Headlight (Porsche 991-style) -->
    <circle cx="475" cy="175" r="14" fill="#f5f5f0" opacity="0.8" stroke="#a8852a" stroke-width="1.5"/>
    <circle cx="475" cy="175" r="6" fill="#ffd700" opacity="0.4"/>
    <!-- Taillight bar -->
    <rect x="115" y="240" width="40" height="6" rx="3" fill="#ff4444" opacity="0.6" stroke="#a8852a" stroke-width="0.5"/>
    <!-- Wheels (GT3 center-lock) -->
    <circle cx="205" cy="410" r="32" fill="#111" stroke="#333" stroke-width="4"/>
    <circle cx="205" cy="410" r="14" fill="none" stroke="#555" stroke-width="2"/>
    <circle cx="205" cy="410" r="5" fill="#c9a84c"/>
    <circle cx="420" cy="410" r="32" fill="#111" stroke="#333" stroke-width="4"/>
    <circle cx="420" cy="410" r="14" fill="none" stroke="#555" stroke-width="2"/>
    <circle cx="420" cy="410" r="5" fill="#c9a84c"/>
  </g>
  <!-- Text -->
  <text x="800" y="600" font-family="Georgia, serif" font-size="28" fill="#c9a84c" text-anchor="middle" letter-spacing="2">2023 Porsche 911 GT3 RS</text>
  <text x="800" y="635" font-family="system-ui, sans-serif" font-size="14" fill="rgba(245,245,240,0.5)" text-anchor="middle">Placeholder Image</text>
</svg>