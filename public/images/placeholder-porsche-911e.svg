<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#2a2a4e"/>
    </linearGradient>
    <linearGradient id="car" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c9a84c"/>
      <stop offset="100%" style="stop-color:#b8953a"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- Road -->
  <rect x="0" y="650" width="1600" height="250" fill="#0d0d14"/>
  <line x1="0" y1="725" x2="1600" y2="725" stroke="#333" stroke-width="2" stroke-dasharray="40 20"/>
  <!-- Car body -->
  <g transform="translate(300, 200) scale(1.6)">
    <!-- Shadow -->
    <ellipse cx="312" cy="430" rx="280" ry="20" fill="rgba(0,0,0,0.4)"/>
    <!-- Main body -->
    <path d="M60 300 L80 250 L140 220 L340 220 L440 260 L500 280 L520 320 L530 380 L530 410 L90 410 L70 380 L60 340 Z" fill="#6FB1E0" stroke="#4a8ab5" stroke-width="2"/>
    <!-- Roof -->
    <path d="M140 220 L200 140 L300 120 L380 130 L440 260 L340 220 Z" fill="#5a9ec8" stroke="#4a8ab5" stroke-width="2"/>
    <!-- Windows -->
    <path d="M180 200 L220 155 L290 145 L360 155 L390 200 Z" fill="#87CEEB" opacity="0.6"/>
    <!-- Front windshield -->
    <path d="M390 200 L360 155 L390 140 L430 200 Z" fill="#87CEEB" opacity="0.5"/>
    <!-- Wheels -->
    <circle cx="160" cy="410" r="45" fill="#1a1a1a"/>
    <circle cx="160" cy="410" r="25" fill="#333"/>
    <circle cx="160" cy="410" r="8" fill="#c9a84c"/>
    <circle cx="460" cy="410" r="45" fill="#1a1a1a"/>
    <circle cx="460" cy="410" r="25" fill="#333"/>
    <circle cx="460" cy="410" r="8" fill="#c9a84c"/>
    <!-- Headlight -->
    <ellipse cx="525" cy="330" rx="12" ry="8" fill="#FFD700" opacity="0.8"/>
    <!-- Taillight -->
    <ellipse cx="62" cy="340" rx="8" ry="6" fill="#FF4444" opacity="0.7"/>
    <!-- Details -->
    <line x1="140" y1="300" x2="480" y2="300" stroke="#4a8ab5" stroke-width="1" opacity="0.5"/>
  </g>
  <!-- Badge -->
  <text x="800" y="820" text-anchor="middle" fill="#c9a84c" font-family="Georgia,serif" font-size="14" opacity="0.6">1971 PORSCHE 911E · 3,742 ORIGINAL MILES</text>
</svg>