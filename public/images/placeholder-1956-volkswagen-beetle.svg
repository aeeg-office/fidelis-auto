<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#2a2a4e"/>
    </linearGradient>
    <linearGradient id="car" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c9a84c"/>
      <stop offset="100%" style="stop-color:#b8953a"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- Road -->
  <rect x="0" y="650" width="1600" height="250" fill="#0d0d14"/>
  <line x1="0" y1="725" x2="1600" y2="725" stroke="#333" stroke-width="2" stroke-dasharray="40 20"/>
  <!-- Car body - 1956 Beetle -->
  <g transform="translate(300, 220) scale(1.6)">
    <!-- Shadow -->
    <ellipse cx="312" cy="430" rx="270" ry="18" fill="rgba(0,0,0,0.4)"/>
    <!-- Body -->
    <path d="M150,140 Q160,90 200,80 L240,75 Q280,70 320,72 Q370,74 400,85 Q430,95 440,140 Z" fill="url(#car)" stroke="#a8852a" stroke-width="1.5"/>
    <!-- Side panels -->
    <path d="M160,170 Q180,155 220,148 L300,142 Q380,145 420,155 Q440,165 445,180 L160,180 Z" fill="#b8953a" opacity="0.4"/>
    <!-- Fenders -->
    <path d="M110,250 Q100,170 140,160 Q160,155 175,170 Q185,200 175,280 Q160,310 130,310 Q105,305 110,250 Z" fill="url(#car)" stroke="#a8852a" stroke-width="1.5"/>
    <path d="M495,250 Q505,170 470,160 Q450,155 435,170 Q425,200 435,280 Q450,310 480,310 Q500,305 495,250 Z" fill="url(#car)" stroke="#a8852a" stroke-width="1.5"/>
    <!-- Windows -->
    <path d="M175,140 Q210,105 260,100 L320,100 Q370,105 410,140 Q370,130 320,125 L260,125 Q210,125 175,140 Z" fill="#2a2a4e" stroke="#8a7020" stroke-width="1"/>
    <!-- Headlight -->
    <circle cx="485" cy="195" r="12" fill="#f5f5f0" opacity="0.7" stroke="#a8852a" stroke-width="1.5"/>
    <!-- Taillight -->
    <circle cx="140" cy="225" r="8" fill="#ff4444" opacity="0.6" stroke="#a8852a" stroke-width="1"/>
    <!-- Wheels -->
    <circle cx="210" cy="410" r="30" fill="#111" stroke="#333" stroke-width="4"/>
    <circle cx="210" cy="410" r="12" fill="#666"/>
    <circle cx="400" cy="410" r="30" fill="#111" stroke="#333" stroke-width="4"/>
    <circle cx="400" cy="410" r="12" fill="#666"/>
    <!-- Bumpers -->
    <rect x="100" y="270" width="60" height="10" rx="4" fill="#888" stroke="#666" stroke-width="1"/>
    <rect x="450" y="270" width="60" height="10" rx="4" fill="#888" stroke="#666" stroke-width="1"/>
  </g>
  <!-- Text -->
  <text x="800" y="600" font-family="Georgia, serif" font-size="28" fill="#c9a84c" text-anchor="middle" letter-spacing="2">1956 Volkswagen Beetle</text>
  <text x="800" y="635" font-family="system-ui, sans-serif" font-size="14" fill="rgba(245,245,240,0.5)" text-anchor="middle">Placeholder Image</text>
</svg>